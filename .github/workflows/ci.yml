name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

env:
  DATABASE_URL: postgresql+psycopg://pricemaster:pricemaster@localhost:5432/pricemaster

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

  test:
    name: test (pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pricemaster
          POSTGRES_PASSWORD: pricemaster
          POSTGRES_DB: pricemaster
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pricemaster -d pricemaster"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run pytest
        # TODO: УБРАТЬ после появления реальных тестов (pytest c 0 тестов
        #        выходит с кодом 5 и валит job). Сейчас тесты-заглушки.
        continue-on-error: true
        run: python -m pytest -q --maxfail=1