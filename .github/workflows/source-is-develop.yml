name: source-is-develop

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Validate source branch
        shell: bash
        run: |
          if [ "${{ github.head_ref }}" != "develop" ]; then
            echo "::error::PR в main может быть только из ветки develop. Источник: ${{ github.head_ref }}"
            exit 1
          fi
          echo "OK: PR из develop"