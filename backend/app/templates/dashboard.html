<!DOCTYPE html>
<!--
  Шаблон веб-дашборда (FastAPI templates + Chart.js).

  Страница, требуемая ТЗ (раздел 3): «простая страница с графиком изменения
  цен и таблицей рекомендаций».

  Наполнение (реализуется при разработке):
    - <script> Chart.js подключается через CDN;
    - контейнер для графика истории цен: данные берутся из GET /price-history
      для всех товаров (или выбранного через селектор);
    - таблица рекомендаций: продукт, recommended_price, reasoning, status —
      из GET /recommendations; кнопка-переход в документацию API.

  Рендерится роутером GET /dashboard в backend/app/main.py.
-->
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>PriceMaster — дашборд</title>
</head>
<body>
    <h1>PriceMaster</h1>
    <section>
        <h2>История цен</h2>
        <canvas id="priceChart"></canvas>
    </section>
    <section>
        <h2>Рекомендации агента</h2>
        <table id="recommendations">
            <thead><tr><th>Товар</th><th>Цена</th><th>Обоснование</th><th>Статус</th></tr></thead>
            <tbody></tbody>
        </table>
    </section>
</body>
</html>
