# =========================================================================
# PriceMaster — docker-compose: db, api, bot, llm
# =========================================================================

services:
  # --- PostgreSQL ---
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- FastAPI backend (модуль данных и API + дашборд) ---
  api:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      LLM_API_URL: http://llm:11434/v1
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # --- Telegram-bot ---
  bot:
    build: ./bot
    restart: unless-stopped
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      ACCESS_KEY: ${ACCESS_KEY}
      API_URL: http://api:8000
    depends_on:
      - api

  # --- LLM через Ollama: OpenAI-совместимый API ---
  llm:
    image: ollama/ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    # Модель подтягивается при первом запуске: docker compose exec llm ollama pull qwen2.5:14b

volumes:
  pgdata:
  ollama: