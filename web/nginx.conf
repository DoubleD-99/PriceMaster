# nginx для PWA: раздаём SPA-статику и проксируем API-префиксы на сервис api.
# Пути API (SDD, A.5) идут без общего префикса, поэтому перечислены явно.
# Проксирование даёт единый origin — CORS не требуется.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Резолвим api через встроенный DNS Docker на этапе запроса, а не при
    # старте: nginx не падает, если api поднимается позже.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $api_upstream api:8000;

    # API → FastAPI-сервис compose.
    location ~ ^/(auth|stores|products|inventory|wms|barcodes|recommendations|analytics)(/|$) {
        proxy_pass http://$api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA-роутинг: неизвестные пути отдают index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
